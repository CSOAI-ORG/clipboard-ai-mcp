name: clipboard-ai-mcp
description: AI-powered clipboard ai MCP server for agents. Supports get clipboard,
  set clipboard, clipboard history. By MEOK AI Labs.
version: 1.0.0
tools:
- name: get_clipboard
  description: MEOK AI Labs tool.
  parameters: []
- name: set_clipboard
  description: MEOK AI Labs tool.
  parameters:
  - name: text
    type: string
    required: true
- name: clipboard_history
  description: MEOK AI Labs tool.
  parameters:
  - name: limit
    type: integer
    required: false
- name: smart_paste
  description: MEOK AI Labs tool.
  parameters:
  - name: format
    type: string
    required: false
startCommand:
  type: stdio
  configSchema:
    type: object
    required:
    - apiKey
    properties:
      apiKey:
        type: string
        description: Your MEOK API Key
  commandFunction: "(config) => ({\n  command: 'uvx',\n  args: ['clipboard-ai-mcp',\
    \ '--api-key', config.apiKey],\n  env: {\n    MEOK_API_KEY: config.apiKey\n  }\n\
    })"
